---
- name: Refuse to seed a host that has not opted in
  ansible.builtin.assert:
    that:
      - pault_seed_target | default(false) | bool
    fail_msg: >-
      Refusing to seed a host without pault_seed_target set.
    quiet: true

- name: Refuse to seed the production stack
  ansible.builtin.assert:
    that:
      - inventory_hostname != 'pault'
    fail_msg: >-
      Refusing to seed pault.
    quiet: true

- name: Refuse to seed without a readable source
  ansible.builtin.assert:
    that:
      - pault_seed_source | default('') | length > 0
      - pault_seed_source in groups['pault_env']
      - hostvars[pault_seed_source].pault_s3_readonly_access_key | default('') | length > 0
      - hostvars[pault_seed_source].pault_s3_readonly_secret_key | default('') | length > 0
    fail_msg: >-
      pault_seed_source must name a host in pault_env whose S3 credentials are set.
    quiet: true

- name: Refuse to seed a host from itself
  ansible.builtin.assert:
    that:
      - inventory_hostname != pault_seed_source
    fail_msg: >-
      pault_seed_source must name a host other than this one.
    quiet: true

- name: Refuse to seed into an unnamed bucket
  ansible.builtin.assert:
    that:
      - pault_s3_bucket | default('') | length > 0
    fail_msg: >-
      pault_s3_bucket must be set.
    quiet: true

- name: Check for a leftover seed environment
  ansible.builtin.stat:
    path: "{{ pault_stack_dir }}/minio-seed.env"
  register: pault_seed_env_stat

- name: Refuse to seed over a leftover seed environment
  ansible.builtin.assert:
    that:
      - not pault_seed_env_stat.stat.exists
    fail_msg: >-
      minio-seed.env is still present from a previous seed that did not clean up.
      Remove it before retrying.
    quiet: true

- name: Mirror the source bucket into this stack
  block:
    - name: Deploy the MinIO seed script
      ansible.builtin.template:
        src: minio-seed.sh.j2
        dest: "{{ pault_stack_dir }}/minio-seed.sh"
        owner: root
        group: root
        mode: "0755"

    - name: Write the seed environment
      ansible.builtin.template:
        src: minio-seed.env.j2
        dest: "{{ pault_stack_dir }}/minio-seed.env"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Run the mirror
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - pault
          - --env-file
          - "{{ pault_stack_dir }}/minio-seed.env"
          - -v
          - "{{ pault_stack_dir }}/minio-seed.sh:/minio-seed.sh:ro"
          - --entrypoint
          - /bin/sh
          - "{{ pault_mc_image }}"
          - /minio-seed.sh
      changed_when: true
      no_log: true
  always:
    - name: Remove the seed environment
      ansible.builtin.file:
        path: "{{ pault_stack_dir }}/minio-seed.env"
        state: absent
