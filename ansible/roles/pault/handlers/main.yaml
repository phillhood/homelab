---
- name: Restart the pault container
  ansible.builtin.command:
    argv:
      - pct
      - reboot
      - "{{ pault_container_id }}"
  delegate_to: kvatch
  changed_when: true

- name: Wait for the pault container to accept connections
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 22
    delay: 2
    timeout: 120
  delegate_to: kvatch
  changed_when: false

- name: Recreate the pault stack
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ pault_stack_dir }}/docker-compose.yml"
      - up
      - -d
      - --force-recreate
      - --remove-orphans
  changed_when: true
  no_log: true
