---
pault_container_features: nesting=1,keyctl=1

pault_stack_dir: /opt/pault
pault_minio_data: /opt/pault/minio
pault_cloudflared_dir: /opt/pault/cloudflared
pault_cloudflared_uid: 65532

pault_web_port: 80
pault_api_port: 8080
pault_minio_port: 9000

pault_web_image: ""
pault_api_image: ""
pault_import_image: ""
pault_tunnel_id: ""

pault_seed_target: false

pault_s3_bucket: pault
pault_s3_region: us-east-1
pault_session_ttl: 7d
pault_presign_ttl: 1h
pault_presign_window: 15m
pault_manifest_cache_ttl: 60s
pault_photos_max_limit: 100
pault_site_timezone: America/Toronto
pault_webauthn_rp_id: "{{ pault_public_host }}"
pault_webauthn_origin: "https://{{ pault_public_host }}"

pault_minio_healthcheck:
  - CMD-SHELL
  - "curl -fsS http://localhost:9000/minio/health/live || exit 1"
