---
- name: Restart the music container
  ansible.builtin.command:
    argv:
      - pct
      - reboot
      - "{{ music_container_id }}"
  changed_when: true

- name: Wait for the music container to accept connections
  ansible.builtin.wait_for:
    host: "{{ hostvars[groups['music'] | first].ansible_host }}"
    port: 22
    delay: 2
    timeout: 120
  changed_when: false
