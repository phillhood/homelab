---
- name: Check the music disk is attached
  ansible.builtin.stat:
    path: "{{ music_disk_by_id }}"
    follow: true
  register: music_disk_stat

- name: Assert the music disk is present
  ansible.builtin.assert:
    that: music_disk_stat.stat.exists
    fail_msg: >-
      {{ music_disk_by_id }} not found. Is the enclosure attached to
      {{ inventory_hostname }}? See roles/music_storage/README.md.
    success_msg: "Music disk present."

- name: Read the existing filesystem signature
  ansible.builtin.command:
    argv:
      - blkid
      - -o
      - export
      - "{{ music_disk_partition }}"
  register: music_blkid
  changed_when: false
  failed_when: false
  check_mode: false

- name: Check whether the partition device exists
  ansible.builtin.stat:
    path: "{{ music_disk_partition }}"
    follow: true
  register: music_part_stat

- name: Refuse to format on an unreadable filesystem signature
  ansible.builtin.assert:
    that: music_blkid.rc == 0
    fail_msg: >-
      blkid failed on {{ music_disk_partition }} (rc={{ music_blkid.rc }}) but the
      partition device exists. Refusing to format on an unreadable signature.
    success_msg: "Filesystem signature readable."
  when:
    - music_part_stat.stat.exists
    - music_format_disk | bool

- name: Set filesystem facts
  ansible.builtin.set_fact:
    music_fs_type: >-
      {{ music_blkid.stdout_lines | select('match', '^TYPE=') | map('replace', 'TYPE=', '') | first | default('') }}
    music_fs_found_label: >-
      {{ music_blkid.stdout_lines | select('match', '^LABEL=') | map('replace', 'LABEL=', '') | first | default('') }}

- name: Refuse to format over an existing music filesystem
  ansible.builtin.assert:
    that: not (music_format_disk | bool)
    fail_msg: >-
      {{ music_disk_partition }} already holds ext4 '{{ music_fs_label }}'.
      Refusing to format. Drop -e music_format_disk=true.
    success_msg: "Existing ext4 '{{ music_fs_label }}' left untouched."
  when:
    - music_fs_type == 'ext4'
    - music_fs_found_label == music_fs_label

- name: Set the format decision
  ansible.builtin.set_fact:
    music_do_format: >-
      {{ (music_format_disk | bool)
         and not (music_fs_type == 'ext4' and music_fs_found_label == music_fs_label) }}

- name: Create a GPT table with one full-disk partition
  community.general.parted:
    device: "{{ music_disk_by_id }}"
    label: gpt
    number: 1
    part_start: 1MiB
    part_end: "100%"
    state: present
  when: music_do_format | bool

- name: Create the ext4 filesystem
  community.general.filesystem:
    dev: "{{ music_disk_partition }}"
    fstype: ext4
    opts: "-L {{ music_fs_label }} -m 0 -i {{ music_fs_inode_ratio }} -U {{ music_disk_uuid }}"
  when: music_do_format | bool
