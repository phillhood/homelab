---
- name: Install bolt and its polkit daemon dependency
  ansible.builtin.apt:
    name:
      - bolt
      - polkitd
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Start boltd
  ansible.builtin.systemd_service:
    name: bolt
    state: started

- name: Check whether the enclosure is already enrolled
  ansible.builtin.stat:
    path: "/var/lib/boltd/devices/{{ music_tb_uuid }}"
  register: music_tb_enrolled

- name: Enroll the music enclosure
  ansible.builtin.command:
    argv:
      - boltctl
      - enroll
      - --policy
      - auto
      - "{{ music_tb_uuid }}"
  when: not music_tb_enrolled.stat.exists
  changed_when: true

- name: Wait for the disk to appear
  ansible.builtin.wait_for:
    path: "{{ music_disk_partition }}"
    timeout: 30
  when: music_disk_partition is defined
