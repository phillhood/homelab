---
- name: Refuse to build a repository without a password
  ansible.builtin.assert:
    that:
      - restic_repo_password | default('') | length > 0
    fail_msg: >-
      restic_repo_password is empty. restic would accept it and create a
      repository nobody can prove the contents of — set it in
      inventory/group_vars/proxmox.sops.yaml.
    quiet: true

- name: Install the backup tooling
  ansible.builtin.apt:
    name:
      - restic
      - sqlite3
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the backup directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ music_backup_repo | dirname }}"
    - "{{ music_backup_staging | dirname }}"
    - "{{ music_backup_password_file | dirname }}"

- name: Install the repository password
  ansible.builtin.copy:
    content: "{{ restic_repo_password }}"
    dest: "{{ music_backup_password_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Initialise the restic repository
  ansible.builtin.command:
    argv: [restic, init]
  environment:
    RESTIC_REPOSITORY: "{{ music_backup_repo }}"
    RESTIC_PASSWORD_FILE: "{{ music_backup_password_file }}"
  args:
    creates: "{{ music_backup_repo }}/config"

- name: Install the backup script
  ansible.builtin.template:
    src: music-backup.sh.j2
    dest: "{{ music_backup_script }}"
    owner: root
    group: root
    mode: "0700"

- name: Install the backup units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - music-backup.service
    - music-backup.timer

- name: Enable the backup timer
  ansible.builtin.systemd_service:
    name: music-backup.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode
