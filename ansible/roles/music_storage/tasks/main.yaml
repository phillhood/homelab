---
- name: Enroll the Thunderbolt enclosure
  ansible.builtin.import_tasks: thunderbolt.yaml
  tags: [thunderbolt, storage]

- name: Prepare the music disk
  ansible.builtin.import_tasks: disk.yaml
  tags: [disk, storage]

- name: Mount the music disk
  ansible.builtin.import_tasks: mount.yaml
  tags: [host-mount, storage]

- name: Create the storage layout
  ansible.builtin.import_tasks: layout.yaml
  tags: [layout, storage]

- name: Attach the container bind mount
  ansible.builtin.import_tasks: container_mount.yaml
  tags: [bind-mount]

- name: Install the content backup
  ansible.builtin.import_tasks: backup.yaml
  tags: [music-backup, storage]
