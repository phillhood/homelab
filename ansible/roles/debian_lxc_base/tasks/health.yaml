---
- name: Collect failed systemd units
  ansible.builtin.command: systemctl --failed --no-legend --plain
  register: lxc_failed_units
  changed_when: false
  check_mode: false

- name: Filter out expected failed units
  ansible.builtin.set_fact:
    lxc_unexpected_failed_units: >-
      {{ lxc_failed_units.stdout_lines | map('split') | map('first') | list
         | difference(lxc_expected_failed_units) }}

- name: Assert no unexpected failed units
  ansible.builtin.assert:
    that: lxc_unexpected_failed_units | length == 0
    fail_msg: >-
      Unexpected failed units: {{ lxc_unexpected_failed_units | join(', ') }}.
      See roles/debian_lxc_base/README.md.
    success_msg: "No unexpected failed units."

- name: Check systemd-sysctl state
  ansible.builtin.command: systemctl is-active systemd-sysctl
  register: lxc_sysctl
  changed_when: false
  failed_when: false
  check_mode: false

- name: Assert systemd-sysctl is active
  ansible.builtin.assert:
    that: lxc_sysctl.stdout == "active"
    fail_msg: >-
      systemd-sysctl is '{{ lxc_sysctl.stdout }}', expected 'active'.
      See roles/debian_lxc_base/README.md.
    success_msg: "systemd-sysctl active."
