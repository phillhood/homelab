---
- name: Reload systemd after removing stale units
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reset failed units
  ansible.builtin.command:
    argv: >-
      {{ ['systemctl', 'reset-failed']
         + (lxc_dangling_units.stdout_lines | map('basename') | list) }}
  changed_when: true
