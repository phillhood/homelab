---
- name: Refuse to render app.ini without a root URL
  ansible.builtin.assert:
    that: forgejo_root_url | default('') | length > 0
    fail_msg: >-
      forgejo_root_url is not set. Forgejo bakes ROOT_URL into every clone URL and
      every image reference in its OCI registry, so an empty one is not recoverable
      by editing it later. Set it in inventory/group_vars/forge.yaml.
    quiet: true

- name: Render app.ini
  ansible.builtin.template:
    src: app.ini.j2
    dest: "{{ forgejo_config_dir }}/app.ini"
    owner: root
    group: "{{ forgejo_user }}"
    mode: "0640"
  no_log: true
  notify: Restart forgejo

- name: Apply the restart now, not at end of play
  ansible.builtin.meta: flush_handlers

- name: Enable and start forgejo
  ansible.builtin.systemd_service:
    name: forgejo
    enabled: true
    state: started

- name: Wait for forgejo to answer
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ forgejo_http_port }}/api/healthz"
    status_code: [200]
  register: forgejo_ready
  until: forgejo_ready is succeeded
  retries: 20
  delay: 3
