---
- name: Install Tailscale apt prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Fetch the Tailscale signing key
  ansible.builtin.get_url:
    url: >-
      https://pkgs.tailscale.com/stable/debian/{{ ansible_facts['distribution_release'] }}.noarmor.gpg
    dest: /etc/apt/keyrings/tailscale.gpg
    owner: root
    group: root
    mode: "0644"
    force: true

- name: Add the Tailscale apt repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: [deb]
    uris: https://pkgs.tailscale.com/stable/debian
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: [main]
    architectures: [amd64]
    signed_by: /etc/apt/keyrings/tailscale.gpg
    state: present

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Enable IP forwarding for the subnet route
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/99-tailscale.conf
    sysctl_set: true
    state: present
    reload: true
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.forwarding

- name: Enable and start tailscaled
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started
