---
- name: Refuse to render a Caddyfile with missing values
  ansible.builtin.assert:
    that:
      - caddy_acme_email | default('') | length > 0
      - forge_backend | default('') | length > 0
      - registry_backend | default('') | length > 0
      - pault_web_backend | default('') | length > 0
      - pault_api_backend | default('') | length > 0
    fail_msg: >-
      caddy_acme_email, forge_backend, registry_backend, pault_web_backend and
      pault_api_backend must all be set in
      inventory/group_vars/proxy.yaml. Empty values render a Caddyfile that passes
      validation and then serves the catch-all for every vhost.
    quiet: true

- name: Write the Cloudflare credential env file
  ansible.builtin.copy:
    content: "CLOUDFLARE_API_TOKEN={{ cloudflare_api_token }}\n"
    dest: "{{ caddy_config_dir }}/caddy.env"
    owner: root
    group: "{{ caddy_user }}"
    mode: "0640"
  no_log: true
  notify: Restart caddy

- name: Render the Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ caddy_config_dir }}/Caddyfile"
    owner: root
    group: "{{ caddy_user }}"
    mode: "0640"
    validate: "/usr/local/bin/caddy validate --config %s --adapter caddyfile"
  environment:
    CLOUDFLARE_API_TOKEN: "{{ caddy_validate_token }}"
  notify: Reload caddy

- name: Enable and start caddy
  ansible.builtin.systemd_service:
    name: caddy
    enabled: true
    state: started
