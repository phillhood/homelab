---
- name: Create the caddy group
  ansible.builtin.group:
    name: "{{ caddy_user }}"
    system: true
    state: present

- name: Create the caddy user
  ansible.builtin.user:
    name: "{{ caddy_user }}"
    group: "{{ caddy_user }}"
    home: "{{ caddy_data_dir }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: true
    state: present

- name: Create the caddy config directory
  ansible.builtin.file:
    path: "{{ caddy_config_dir }}"
    state: directory
    owner: root
    group: "{{ caddy_user }}"
    mode: "0750"

- name: Create the caddy data directory
  ansible.builtin.file:
    path: "{{ caddy_data_dir }}"
    state: directory
    owner: "{{ caddy_user }}"
    group: "{{ caddy_user }}"
    mode: "0700"

- name: Fetch the Caddy binary
  ansible.builtin.get_url:
    url: "{{ caddy_download_url }}"
    dest: /usr/local/bin/caddy
    checksum: "sha256:{{ caddy_sha256 }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart caddy

- name: Allow caddy to bind privileged ports
  community.general.capabilities:
    path: /usr/local/bin/caddy
    capability: cap_net_bind_service=ep
    state: present

- name: Install the caddy systemd unit
  ansible.builtin.template:
    src: caddy.service.j2
    dest: /etc/systemd/system/caddy.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart caddy

- name: Reload systemd so it tracks the caddy unit
  ansible.builtin.systemd_service:
    daemon_reload: true
  changed_when: false
