---
- name: Install PostgreSQL and the Ansible driver
  ansible.builtin.apt:
    name:
      - "postgresql-{{ postgresql_version }}"
      - python3-psycopg2
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Confine PostgreSQL to the Unix socket
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ postgresql_version }}/main/postgresql.conf"
    regexp: "^#?listen_addresses\\s*="
    line: "listen_addresses = '{{ postgresql_listen_addresses }}'"
    owner: postgres
    group: postgres
    mode: "0640"
  notify: Restart postgresql

- name: Require a password over the socket for this instance's own database
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ postgresql_version }}/main/pg_hba.conf"
    regexp: "^local\\s+{{ postgresql_db }}\\s+{{ postgresql_user }}\\s+\\S+\\s*$"
    line: "local   {{ postgresql_db }}   {{ postgresql_user }}   scram-sha-256"
    insertbefore: "^local\\s+all\\s+all\\s+\\S+\\s*$"
    owner: postgres
    group: postgres
    mode: "0640"
  when: postgresql_db != "" and postgresql_user != ""
  notify: Reload postgresql

- name: Keep peer as the default for every other local connection
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ postgresql_version }}/main/pg_hba.conf"
    regexp: "^local\\s+all\\s+all\\s+\\S+\\s*$"
    line: "local   all             all                                     peer"
    owner: postgres
    group: postgres
    mode: "0640"
  notify: Reload postgresql

- name: Apply the restart or reload now, not at end of play
  ansible.builtin.meta: flush_handlers

- name: Enable and start postgresql
  ansible.builtin.systemd_service:
    name: postgresql
    enabled: true
    state: started
