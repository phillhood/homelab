---
- name: Create the headscale group
  ansible.builtin.group:
    name: "{{ headscale_user }}"
    system: true
    state: present

- name: Create the headscale user
  ansible.builtin.user:
    name: "{{ headscale_user }}"
    group: "{{ headscale_user }}"
    home: "{{ headscale_data_dir }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: true
    state: present

- name: Create the headscale config directory
  ansible.builtin.file:
    path: "{{ headscale_config_dir }}"
    state: directory
    owner: root
    group: "{{ headscale_user }}"
    mode: "0750"

- name: Create the headscale data directory
  ansible.builtin.file:
    path: "{{ headscale_data_dir }}"
    state: directory
    owner: "{{ headscale_user }}"
    group: "{{ headscale_user }}"
    mode: "0750"

- name: Fetch the headscale binary
  ansible.builtin.get_url:
    url: >-
      https://github.com/juanfont/headscale/releases/download/{{ headscale_version }}/headscale_{{ headscale_version | regex_replace('^v', '') }}_linux_amd64
    dest: /usr/local/bin/headscale
    checksum: "sha256:{{ headscale_sha256 }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart headscale

- name: Install the headscale systemd unit
  ansible.builtin.template:
    src: headscale.service.j2
    dest: /etc/systemd/system/headscale.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart headscale

- name: Reload systemd so it tracks the headscale unit
  ansible.builtin.systemd_service:
    daemon_reload: true
  changed_when: false
