---
- name: Assert the web password is not empty
  ansible.builtin.assert:
    that: pihole_web_password | default('') | length > 0
    fail_msg: >-
      pihole_web_password is empty. `pihole setpassword` treats a blank first line on
      stdin as "remove the password" — it disables authentication on the web interface
      and exits 0, so this would fail silently. See roles/pihole/README.md.
    success_msg: "Web password is set."
  when: pihole_fresh_install | bool or pihole_reset_password | bool

- name: Set the Pi-hole web password
  ansible.builtin.command:
    argv:
      - pihole
      - setpassword
    stdin: "{{ pihole_web_password }}\n{{ pihole_web_password }}"
  when: pihole_fresh_install | bool or pihole_reset_password | bool
  changed_when: true
  no_log: true
