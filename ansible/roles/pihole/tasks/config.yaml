---
- name: Apply Pi-hole settings idempotently
  ansible.builtin.include_tasks: _set_key.yaml
  loop: "{{ pihole_config | dict2items }}"
  loop_control:
    loop_var: cfg_item
    label: "{{ cfg_item.key }}"

- name: Apply local DNS records
  ansible.builtin.include_tasks: _set_key.yaml
  loop:
    - key: dns.hosts
      value: "{{ pihole_local_records }}"
  loop_control:
    loop_var: cfg_item
    label: dns.hosts

- name: Render the lab wildcard dnsmasq config
  ansible.builtin.template:
    src: 10-lab.conf.j2
    dest: /etc/dnsmasq.d/10-lab.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart pihole dns
