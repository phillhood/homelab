---
backup_pihole_dir: "{{ playbook_dir }}/../../.dev/pihole-backups"
backup_opnsense_dir: "{{ playbook_dir }}/../../.dev/opnsense-backups"
backup_music_dir: "{{ playbook_dir }}/../../.dev/music-backups"
backup_retention: 14
opnsense_host: 192.168.1.1

backup_prune_targets:
  - path: "{{ backup_pihole_dir }}"
    patterns: ["*.zip"]
  - path: "{{ backup_opnsense_dir }}"
    patterns: ["*.xml"]
  - path: "{{ backup_music_dir }}"
    patterns: ["manifest-*.tsv.gz"]
  - path: "{{ backup_music_dir }}"
    patterns: ["config-*.tar.gz"]
