---
backup_pihole_dir: "{{ repo_root }}/.dev/pihole-backups"
backup_opnsense_dir: "{{ repo_root }}/.dev/opnsense-backups"
backup_music_dir: "{{ repo_root }}/.dev/music-backups"
backup_forgejo_dir: "{{ repo_root }}/.dev/forgejo-backups"
backup_terraform_dir: "{{ repo_root }}/.dev/terraform-backups"
backup_terraform_state: "{{ repo_root }}/terraform/environments/kvatch/terraform.tfstate"
backup_headscale_dir: "{{ repo_root }}/.dev/headscale-backups"
backup_headscale_data_dir: /var/lib/headscale
backup_retention: 14
opnsense_host: 192.168.1.1

backup_prune_targets:
  - path: "{{ backup_pihole_dir }}"
    patterns: ["*.zip"]
  - path: "{{ backup_opnsense_dir }}"
    patterns: ["*.xml"]
  - path: "{{ backup_music_dir }}"
    patterns: ["manifest-*.tsv.gz"]
  - path: "{{ backup_music_dir }}"
    patterns: ["config-*.tar.gz"]
  - path: "{{ backup_forgejo_dir }}"
    patterns: ["forgejo-dump-*.zip"]
  - path: "{{ backup_terraform_dir }}"
    patterns: ["terraform-*.tfstate"]
  - path: "{{ backup_terraform_dir }}"
    patterns: ["terraform-*.tfstate.backup"]
  - path: "{{ backup_terraform_dir }}"
    patterns: ["restore-imports-*.sh"]
  - path: "{{ backup_headscale_dir }}"
    patterns: ["headscale-*.tar.gz"]
