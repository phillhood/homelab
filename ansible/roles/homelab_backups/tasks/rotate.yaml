---
- name: Ensure backup dirs exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  loop: "{{ backup_prune_targets | map(attribute='path') | unique }}"

- name: Find backups in each series
  ansible.builtin.find:
    paths: "{{ item.path }}"
    patterns: "{{ item.patterns }}"
  register: backup_inventory
  changed_when: false
  delegate_to: localhost
  loop: "{{ backup_prune_targets }}"
  loop_control:
    label: "{{ item.path }} {{ item.patterns }}"

- name: Prune backups beyond the retention count
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  delegate_to: localhost
  loop: >-
    {{ backup_inventory.results
       | map(attribute='files') | map('sort', attribute='mtime', reverse=true)
       | map('community.general.json_query', '[' ~ backup_retention ~ ':]')
       | flatten }}
  loop_control:
    label: "{{ item.path }}"
