---
- name: Look for the backup script
  ansible.builtin.stat:
    path: "{{ music_backup_script }}"
  register: music_backup_script_stat

- name: Refuse to continue if the backup was never provisioned
  ansible.builtin.assert:
    that:
      - music_backup_script_stat.stat.exists
    fail_msg: >-
      {{ music_backup_script }} is missing. It is installed by the
      music_storage role — run `make apply`, or the musicbackup tag, first.
    quiet: true

- name: Back up the music content
  ansible.builtin.command:
    argv: ["{{ music_backup_script }}"]
  register: backup_music_content
  changed_when: true

- name: Report what the backup did
  ansible.builtin.debug:
    var: backup_music_content.stdout_lines
