---
- name: Ensure the local Forgejo backup dir exists
  ansible.builtin.file:
    path: "{{ backup_forgejo_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost

- name: Build the dump filename
  ansible.builtin.set_fact:
    forgejo_dump_name: "forgejo-dump-{{ ansible_date_time.iso8601_basic_short }}.zip"

- name: Dump Forgejo without package data
  ansible.builtin.command:
    argv:
      - /usr/local/bin/forgejo
      - dump
      - --skip-package-data
      - --file
      - "/tmp/{{ forgejo_dump_name }}"
      - --config
      - "{{ backup_forgejo_config_dir }}/app.ini"
    chdir: /tmp
  become: true
  become_method: ansible.builtin.su
  become_user: "{{ backup_forgejo_user }}"
  environment:
    GITEA_WORK_DIR: "{{ backup_forgejo_home }}"
  register: forgejo_dump_run
  changed_when: true

- name: Ensure zip is available to strip the rendered app.ini
  ansible.builtin.apt:
    name: zip
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Strip the rendered app.ini from the dump before it leaves the host
  ansible.builtin.command:
    argv:
      - zip
      - -d
      - "/tmp/{{ forgejo_dump_name }}"
      - app.ini
  when: forgejo_dump_run is not skipped
  changed_when: true

- name: Fetch the dump to the control node
  ansible.builtin.fetch:
    src: "/tmp/{{ forgejo_dump_name }}"
    dest: "{{ backup_forgejo_dir }}/"
    flat: true
  when: forgejo_dump_run is not skipped

- name: Remove the dump from the forge host
  ansible.builtin.file:
    path: "/tmp/{{ forgejo_dump_name }}"
    state: absent
  when: forgejo_dump_run is not skipped
