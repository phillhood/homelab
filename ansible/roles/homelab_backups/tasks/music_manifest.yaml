---
- name: Ensure the local music backup dir exists
  ansible.builtin.file:
    path: "{{ backup_music_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost

- name: Build the library manifest
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      find {{ music_container_mount }}/library -type f -printf '%p\t%s\t%T@\n'
      | sort | gzip -9 > /tmp/music-manifest.tsv.gz
    executable: /bin/bash
  changed_when: true

- name: Archive the service configuration
  community.general.archive:
    path:
      - /etc/samba/smb.conf
      - "{{ music_syncthing_config_dir | default('/var/lib/syncthing/.local/state/syncthing') }}/config.xml"
      - "{{ music_stack_dir }}/docker-compose.yml"
      - "{{ music_container_mount }}/.state/museek/museek.db"
    dest: /tmp/music-config.tar.gz
    format: gz
    mode: "0600"

- name: Fetch the manifest to the control node
  ansible.builtin.fetch:
    src: /tmp/music-manifest.tsv.gz
    dest: "{{ backup_music_dir }}/manifest-{{ ansible_date_time.iso8601_basic_short }}.tsv.gz"
    flat: true

- name: Fetch the config archive to the control node
  ansible.builtin.fetch:
    src: /tmp/music-config.tar.gz
    dest: "{{ backup_music_dir }}/config-{{ ansible_date_time.iso8601_basic_short }}.tar.gz"
    flat: true

- name: Remove the staged archives from the NAS
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/music-manifest.tsv.gz
    - /tmp/music-config.tar.gz
