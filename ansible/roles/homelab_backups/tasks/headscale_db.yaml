---
- name: Check whether the headscale data directory exists
  ansible.builtin.stat:
    path: "{{ backup_headscale_data_dir }}"
  register: backup_headscale_data_stat

- name: Report that headscale is not installed yet
  ansible.builtin.debug:
    msg: >-
      {{ backup_headscale_data_dir }} not present. Run make apply LIMIT=headscale,
      then re-run with --tags headscale.
  when: not backup_headscale_data_stat.stat.exists

- name: Back up the headscale state
  when: backup_headscale_data_stat.stat.exists
  block:
    - name: Ensure the local headscale backup dir exists
      ansible.builtin.file:
        path: "{{ backup_headscale_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost

    - name: Build the archive filename
      ansible.builtin.set_fact:
        headscale_archive_name: "headscale-{{ ansible_date_time.iso8601_basic_short }}.tar.gz"

    - name: Stop headscale so SQLite is quiescent
      ansible.builtin.systemd_service:
        name: headscale
        state: stopped

    - name: Archive the headscale state and restart the service
      block:
        - name: Archive the headscale state
          community.general.archive:
            path: "{{ backup_headscale_data_dir }}"
            dest: "/tmp/{{ headscale_archive_name }}"
            format: gz
            mode: "0600"
      always:
        - name: Start headscale
          ansible.builtin.systemd_service:
            name: headscale
            state: started

    - name: Fetch the archive to the control node
      ansible.builtin.fetch:
        src: "/tmp/{{ headscale_archive_name }}"
        dest: "{{ backup_headscale_dir }}/"
        flat: true

    - name: Remove the archive from the headscale host
      ansible.builtin.file:
        path: "/tmp/{{ headscale_archive_name }}"
        state: absent
