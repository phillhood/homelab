---
pihole_config:
  dns.upstreams:
    - "1.1.1.1"
    - "1.0.0.1"
  dns.rateLimit.count: 10000
  dns.rateLimit.interval: 10
  dns.revServers:
    - "true,192.168.1.0/24,192.168.1.1,home"
  misc.privacylevel: 0
  misc.etc_dnsmasq_d: true

pihole_local_records:
  - "192.168.1.1 router.home"
  - "192.168.1.2 switch.home"
  - "192.168.1.5 ap.home"
  - "192.168.1.101 proxmox.home"
  - "192.168.1.101 kvatch.home"
  - "192.168.1.100 pihole.home"
  - "192.168.1.102 music.home"
  - "192.168.1.103 forge.home"
  - "192.168.1.104 registry.home"
  - "192.168.1.105 proxy.home"
  - "192.168.1.106 pault.home"
  - "192.168.1.107 headscale.home"
  - "192.168.1.105 vpn.shychedelic.com"

