---
- name: Configure Proxmox VE hosts
  hosts: proxmox
  gather_facts: true
  roles:
    - proxmox_host
    - pve_templates

- name: Base config for Debian LXCs
  hosts: lxc
  gather_facts: true
  roles:
    - debian_lxc_base

- name: Configure Pi-hole
  hosts: pihole
  gather_facts: true
  roles:
    - pihole
