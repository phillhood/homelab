---
- name: Back up Pi-hole via Teleporter
  hosts: pihole
  gather_facts: true
  tasks:
    - name: Run the Teleporter backup tasks
      ansible.builtin.include_role:
        name: homelab_backups
        tasks_from: pihole_teleporter
        apply:
          tags: [pihole]
      tags: [pihole]

- name: Back up the music library manifest
  hosts: music
  gather_facts: true
  tasks:
    - name: Run the music manifest tasks
      ansible.builtin.include_role:
        name: homelab_backups
        tasks_from: music_manifest
        apply:
          tags: [music]
      tags: [music]

- name: Back up the music content
  hosts: proxmox
  gather_facts: true
  tasks:
    - name: Run the music content tasks
      ansible.builtin.include_role:
        name: homelab_backups
        tasks_from: music_content
        apply:
          tags: [music-content]
      tags: [music-content]

- name: Back up the Forgejo dump
  hosts: forge
  gather_facts: true
  tasks:
    - name: Run the Forgejo dump tasks
      ansible.builtin.include_role:
        name: homelab_backups
        tasks_from: forgejo_dump
        apply:
          tags: [forgejo]
      tags: [forgejo]

- name: Back up the Terraform state
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: Run the Terraform state tasks
      ansible.builtin.include_role:
        name: homelab_backups
        tasks_from: terraform_state
        apply:
          tags: [terraform]
      tags: [terraform]

- name: Back up the headscale state
  hosts: headscale
  gather_facts: true
  tasks:
    - name: Run the headscale state tasks
      ansible.builtin.include_role:
        name: homelab_backups
        tasks_from: headscale_db
        apply:
          tags: [headscale]
      tags: [headscale]

- name: Back up OPNsense config and rotate
  hosts: opnsense
  gather_facts: true
  tasks:
    - name: Run the OPNsense backup tasks
      ansible.builtin.include_role:
        name: homelab_backups
        tasks_from: opnsense_config
        apply:
          tags: [opnsense]
      tags: [opnsense]

    - name: Prune old backups
      ansible.builtin.include_role:
        name: homelab_backups
        tasks_from: rotate
        apply:
          tags: [rotate]
      tags: [rotate]
