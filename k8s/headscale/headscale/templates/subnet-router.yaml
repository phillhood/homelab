---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale-subnet-router
  namespace: headscale
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale-subnet-router
  namespace: headscale
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale-subnet-router
  namespace: headscale
subjects:
  - kind: ServiceAccount
    name: tailscale-subnet-router
    namespace: headscale
roleRef:
  kind: Role
  name: tailscale-subnet-router
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-subnet-router
  namespace: headscale
spec:
  replicas: 0
  selector:
    matchLabels:
      app: tailscale-subnet-router
  template:
    metadata:
      labels:
        app: tailscale-subnet-router
    spec:
      serviceAccountName: tailscale-subnet-router
      containers:
        - name: tailscale
          image: tailscale/tailscale:v1.80.3
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: headscale-secrets
                  key: authkey
            - name: TS_HOSTNAME
              value: "k8s-subnet-router"
            - name: TS_STATE_DIR
              value: "/var/lib/tailscale"
            - name: TS_USERSPACE
              value: "false"
            - name: TS_ROUTES
              value: "192.168.1.0/24"
            - name: TS_EXTRA_ARGS
              value: "--login-server=http://headscale.headscale.svc.cluster.local:8080 --accept-routes=false"
            - name: TS_KUBE_SECRET
              value: "tailscale-subnet-router-state"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          volumeMounts:
            - name: dev-tun
              mountPath: /dev/net/tun
            - name: state
              mountPath: /var/lib/tailscale
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: dev-tun
          hostPath:
            path: /dev/net/tun
        - name: state
          emptyDir: {}
