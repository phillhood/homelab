---
apiVersion: v1
kind: ConfigMap
metadata:
  name: headplane-config
  namespace: headscale
data:
  config.yaml: |
    server:
      host: 0.0.0.0
      port: 3000
      cookie_secure: true
      cookie_secret_path: /etc/headplane-secrets/cookie-secret
    headscale:
      url: http://headscale.headscale.svc.cluster.local:8080
      config_strict: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: headplane-data
  namespace: headscale
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: headplane
  namespace: headscale
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app: headplane
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headplane
  namespace: headscale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headplane
  template:
    metadata:
      labels:
        app: headplane
    spec:
      containers:
        - name: headplane
          image: ghcr.io/tale/headplane:0.6.2-beta.5
          ports:
            - containerPort: 3000
          env:
            - name: HEADSCALE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: headscale-secrets
                  key: api-key
          volumeMounts:
            - name: config
              mountPath: /etc/headplane
            - name: secrets
              mountPath: /etc/headplane-secrets
              readOnly: true
            - name: data
              mountPath: /var/lib/headplane
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: headplane-config
        - name: secrets
          secret:
            secretName: headscale-secrets
        - name: data
          persistentVolumeClaim:
            claimName: headplane-data
