---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vpn-cert
  namespace: headscale
spec:
  secretName: vpn-cert-tls
  dnsNames:
    - vpn.{{ .Values.global.homeDomain }}
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cors-headscale
  namespace: headscale
spec:
  headers:
    accessControlAllowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    accessControlAllowHeaders:
      - Authorization
      - Content-Type
    accessControlAllowOriginList:
      - https://vpn.{{ .Values.global.homeDomain }}
    accessControlMaxAge: 86400
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headscale
  namespace: headscale
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`vpn.{{ .Values.global.homeDomain }}`) && !PathPrefix(`/admin`)
      kind: Rule
      services:
        - name: headscale
          port: 8080
  tls:
    secretName: vpn-cert-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headplane
  namespace: headscale
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`vpn.{{ .Values.global.homeDomain }}`) && PathPrefix(`/admin`)
      kind: Rule
      services:
        - name: headplane
          port: 3000
  tls:
    secretName: vpn-cert-tls
