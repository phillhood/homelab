apiVersion: apps/v1
kind: Deployment
metadata:
  name: wyoming-piper
  namespace: home
  labels:
    app: wyoming-piper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wyoming-piper
  template:
    metadata:
      labels:
        app: wyoming-piper
    spec:
      containers:
        - name: wyoming-piper
          image: rhasspy/wyoming-piper:latest
          args:
            - --voice
            - en_US-lessac-medium
          ports:
            - containerPort: 10200
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            tcpSocket:
              port: 10200
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 10200
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wyoming-piper-data
---
apiVersion: v1
kind: Service
metadata:
  name: wyoming-piper
  namespace: home
spec:
  type: ClusterIP
  ports:
    - port: 10200
      targetPort: 10200
  selector:
    app: wyoming-piper
