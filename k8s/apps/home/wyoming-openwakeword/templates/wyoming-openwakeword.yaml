apiVersion: apps/v1
kind: Deployment
metadata:
  name: wyoming-openwakeword
  namespace: home
  labels:
    app: wyoming-openwakeword
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wyoming-openwakeword
  template:
    metadata:
      labels:
        app: wyoming-openwakeword
    spec:
      containers:
        - name: wyoming-openwakeword
          image: rhasspy/wyoming-openwakeword:latest
          args:
            - --preload-model
            - ok_nabu
          ports:
            - containerPort: 10400
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: 10400
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 10400
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: wyoming-openwakeword
  namespace: home
spec:
  type: ClusterIP
  ports:
    - port: 10400
      targetPort: 10400
  selector:
    app: wyoming-openwakeword
