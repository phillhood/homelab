---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cors-headscale
  namespace: headscale
spec:
  headers:
    accessControlAllowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    accessControlAllowHeaders:
      - Authorization
      - Content-Type
    accessControlAllowOriginList:
      - https://headscale.{{ .Values.global.homeDomain }}
    accessControlMaxAge: 86400
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headscale-ui
  namespace: headscale
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - headscale.{{ .Values.global.homeDomain }}
  rules:
    - host: headscale.{{ .Values.global.homeDomain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headscale-ui
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headscale
  namespace: headscale
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: headscale-cors-headscale@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - vpn.{{ .Values.global.homeDomain }}
  rules:
    - host: vpn.{{ .Values.global.homeDomain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headscale
                port:
                  number: 8080
