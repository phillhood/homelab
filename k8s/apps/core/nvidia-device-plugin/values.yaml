nvidia-device-plugin:
  nodeSelector:
    kubernetes.io/hostname: lab
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  runtimeClassName: nvidia
  config:
    map:
      default: |-
        version: v1
        flags:
          deviceDiscoveryStrategy: nvml
        sharing:
          timeSlicing:
            resources:
              - name: nvidia.com/gpu
                replicas: 4
