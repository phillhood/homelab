---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: element
  namespace: matrix
  labels:
    app: element
spec:
  replicas: 1
  selector:
    matchLabels:
      app: element
  template:
    metadata:
      labels:
        app: element
    spec:
      containers:
        - name: element
          image: vectorim/element-web:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /app/config.json
              subPath: config.json
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: element-config
---
apiVersion: v1
kind: Service
metadata:
  name: element
  namespace: matrix
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: element
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: element
  namespace: matrix
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`element.{{ .Values.global.hobbyDomain }}`)
      kind: Rule
      services:
        - name: element
          port: 80
  tls:
    secretName: hobby-wildcard-tls
