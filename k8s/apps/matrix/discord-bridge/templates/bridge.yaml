---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-bridge
  namespace: matrix
  labels:
    app: discord-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discord-bridge
  template:
    metadata:
      labels:
        app: discord-bridge
    spec:
      initContainers:
        - name: copy-config
          image: busybox
          command:
            - sh
            - -c
            - |
              AS_TOKEN=$(cat /secrets/as-token)
              HS_TOKEN=$(cat /secrets/hs-token)
              sed "s/REPLACE_AS_TOKEN/$AS_TOKEN/g; s/REPLACE_HS_TOKEN/$HS_TOKEN/g" /config-template/config.yaml > /data/config.yaml
              cp /secrets/registration.yaml /data/registration.yaml
          volumeMounts:
            - name: config-template
              mountPath: /config-template
            - name: data
              mountPath: /data
            - name: secrets
              mountPath: /secrets
              readOnly: true
      containers:
        - name: discord-bridge
          image: dock.mau.dev/mautrix/discord:latest
          ports:
            - containerPort: 29334
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /_matrix/mau/live
              port: 29334
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /_matrix/mau/ready
              port: 29334
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config-template
          configMap:
            name: discord-bridge-config
        - name: data
          persistentVolumeClaim:
            claimName: discord-bridge-data
        - name: secrets
          secret:
            secretName: discord-bridge-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: discord-bridge
  namespace: matrix
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  ports:
    - port: 29334
      targetPort: 29334
  selector:
    app: discord-bridge
