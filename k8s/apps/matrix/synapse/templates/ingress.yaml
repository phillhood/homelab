---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: synapse
  namespace: matrix
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`matrix.{{ .Values.global.hobbyDomain }}`)
      kind: Rule
      services:
        - name: synapse
          port: 8008
  tls:
    secretName: hobby-wildcard-tls
