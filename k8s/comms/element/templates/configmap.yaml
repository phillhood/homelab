---
apiVersion: v1
kind: ConfigMap
metadata:
  name: element-config
  namespace: comms
data:
  config.json: |
    {
      "default_server_config": {
        "m.homeserver": {
          "base_url": "https://matrix.{{ .Values.global.hobbyDomain }}",
          "server_name": "{{ .Values.global.hobbyDomain }}"
        }
      },
      "brand": "Shychedelic Chat",
      "branding": {
        "welcome_background_url": "/background.svg",
        "auth_footer_links": [
          { "text": "shychedelic.com", "url": "https://{{ .Values.global.hobbyDomain }}" }
        ]
      },
      "embedded_pages": {
        "welcome_url": "/welcome.html"
      },
      "setting_defaults": {
        "custom_themes": [
          {
            "name": "Shychedelic",
            "is_dark": true,
            "colors": {
              "accent-color": "#a855f7",
              "primary-color": "#a855f7",
              "warning-color": "#ef4444",
              "sidebar-color": "#0a0a0f",
              "roomlist-background-color": "#0f0f17",
              "roomlist-text-color": "#e2e2e8",
              "roomlist-text-secondary-color": "#a0a0b8",
              "roomlist-highlights-color": "#1a1a28",
              "roomlist-separator-color": "#1e1e2e",
              "timeline-background-color": "#12121a",
              "timeline-text-color": "#e2e2e8",
              "timeline-text-secondary-color": "#a0a0b8",
              "timeline-highlights-color": "#1a1a28",
              "reaction-row-button-selected-bg-color": "#7c3aed"
            }
          }
        ],
        "theme": "custom-Shychedelic"
      },
      "element_call": {
        "url": "https://call.{{ .Values.global.hobbyDomain }}",
        "use_exclusively": true
      },
      "disable_guests": true,
      "disable_3pid_login": false,
      "show_labs_settings": true,
      "room_directory": {
        "servers": ["{{ .Values.global.hobbyDomain }}", "matrix.org"]
      }
    }
