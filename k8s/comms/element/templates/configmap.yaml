        <h1 style="font-size: 2rem; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 0.5rem; background: linear-gradient(135deg, #a855f7, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">Shychedelic - Matrix</h1>
        <p style="font-size: 1.1rem; color: rgba(255, 255, 255, 0.5); margin-bottom: 2rem; line-height: 1.5;">Secure, self-hosted chat for the homies.</p>
        <div style="width: 60px; height: 2px; background: linear-gradient(90deg, #7c3aed, #06b6d4); border-radius: 1px; margin: 0 auto 1.5rem;"></div>
        <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 2rem;">
          <div style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 10px; text-align: left;">
            <svg style="width: 20px; height: 20px; flex-shrink: 0; stroke: #a855f7; stroke-width: 2; fill: none;" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            <span style="font-size: 0.85rem; color: rgba(255, 255, 255, 0.6);">End-to-end encrypted messaging</span>
          </div>
          <div style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 10px; text-align: left;">
            <svg style="width: 20px; height: 20px; flex-shrink: 0; stroke: #a855f7; stroke-width: 2; fill: none;" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            <span style="font-size: 0.85rem; color: rgba(255, 255, 255, 0.6);">Desktop, mobile, and web access</span>
          </div>
          <div style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 10px; text-align: left;">
            <svg style="width: 20px; height: 20px; flex-shrink: 0; stroke: #a855f7; stroke-width: 2; fill: none;" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <span style="font-size: 0.85rem; color: rgba(255, 255, 255, 0.6);">No tracking, no ads, fully self-hosted</span>
          </div>
        </div>
        <p style="font-size: 0.8rem; color: rgba(255, 255, 255, 0.3); line-height: 1.5;">Sign in with your shychedelic account to get started.</p>
      </div>
    </div>
  auto_login.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="utf-8">
      <meta http-equiv="Content-Security-Policy" content="script-src 'unsafe-inline';">
      <title>Logging in...</title>
    </head>
    <body>
    <script>
      var p = new URLSearchParams(location.search);
      var hs = p.get('hs');
      var user = p.get('user');
      var token = p.get('token');
      var device = p.get('device');
      if (hs && user && token && device) {
        localStorage.setItem('mx_hs_url', hs);
        localStorage.setItem('mx_user_id', user);
        localStorage.setItem('mx_access_token', token);
        localStorage.setItem('mx_device_id', device);
        localStorage.setItem('mx_is_guest', 'false');
        location.href = '/';
      } else {
        location.href = '/#/login';
      }
    </script>
    </body>
    </html>
