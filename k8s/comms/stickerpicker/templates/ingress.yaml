apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: stickerpicker
  namespace: comms
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`matrix-gifs.{{ .Values.global.hobbyDomain }}`)
      kind: Rule
      services:
        - name: stickerpicker
          port: 80
  tls:
    secretName: hobby-wildcard-tls
