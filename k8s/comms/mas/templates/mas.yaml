---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mas
  namespace: comms
  labels:
    app: mas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mas
  template:
    metadata:
      labels:
        app: mas
    spec:
      initContainers:
        - name: render-config
          image: python:3-alpine
          command:
            - python3
            - -c
            - |
              import pathlib, urllib.parse
              secrets = {k: pathlib.Path(f'/secrets/{k}').read_text() for k in ['db-password', 'mas-secret', 'encryption-secret', 'oidc-client-secret', 'signing-key']}
              tmpl = pathlib.Path('/config-template/config.yaml').read_text()
              result = tmpl.replace('__DB_PASSWORD__', urllib.parse.quote(secrets['db-password'].strip(), safe=''))
              result = result.replace('__MAS_SECRET__', secrets['mas-secret'].strip())
              result = result.replace('__ENCRYPTION_SECRET__', secrets['encryption-secret'].strip())
              result = result.replace('__OIDC_CLIENT_SECRET__', secrets['oidc-client-secret'].strip())
              pathlib.Path('/rendered-config/config.yaml').write_text(result)
          volumeMounts:
            - name: config-template
              mountPath: /config-template
            - name: rendered-config
              mountPath: /rendered-config
            - name: secrets
              mountPath: /secrets
              readOnly: true
        - name: migrate
          image: ghcr.io/element-hq/matrix-authentication-service:1.11.0
          command: ["mas-cli", "database", "migrate"]
          env:
            - name: MAS_CONFIG
              value: /config/config.yaml
          volumeMounts:
            - name: rendered-config
              mountPath: /config
            - name: secrets
              mountPath: /secrets
              readOnly: true
      containers:
        - name: mas
          image: ghcr.io/element-hq/matrix-authentication-service:1.11.0
          command: ["mas-cli", "server"]
          env:
            - name: MAS_CONFIG
              value: /config/config.yaml
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: rendered-config
              mountPath: /config
            - name: secrets
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config-template
          configMap:
            name: mas-config
        - name: rendered-config
          emptyDir: {}
        - name: secrets
          secret:
            secretName: mas-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: mas
  namespace: comms
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: mas
