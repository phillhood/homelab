---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: matrix-well-known
  namespace: comms
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.global.hobbyDomain }}`) && Path(`/.well-known/openid-configuration`)
      kind: Rule
      priority: 110
      services:
        - name: mas
          port: 8080
    - match: Host(`{{ .Values.global.hobbyDomain }}`) && PathPrefix(`/.well-known/matrix/`)
      kind: Rule
      priority: 100
      services:
        - name: matrix-well-known
          port: 80
  tls:
    secretName: hobby-wildcard-tls
