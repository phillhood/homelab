---
apiVersion: v1
kind: Namespace
metadata:
  name: matrix
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix-well-known
  namespace: comms
data:
  server: |
    {"m.server": "matrix.{{ .Values.global.hobbyDomain }}:443"}
  client: |
    {
      "m.homeserver": {"base_url": "https://matrix.{{ .Values.global.hobbyDomain }}"},
      "org.matrix.msc2965.authentication": {
        "issuer": "https://{{ .Values.global.hobbyDomain }}/",
        "account": "https://mas.{{ .Values.global.hobbyDomain }}/account"
      },
      "org.matrix.msc4143.rtc_foci": [
        {
          "type": "livekit",
          "livekit_service_url": "https://rtc.{{ .Values.global.hobbyDomain }}/livekit/jwt"
        }
      ]
    }
  element: |
    {
      "call": {
        "widget_url": "https://call.{{ .Values.global.hobbyDomain }}"
      }
    }
  nginx.conf: |
    server {
      listen 80;
      location /.well-known/matrix/server {
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
        alias /data/server;
      }
      location /.well-known/matrix/client {
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
        alias /data/client;
      }
      location /.well-known/element/element.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
        alias /data/element;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-well-known
  namespace: comms
  labels:
    app: matrix-well-known
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matrix-well-known
  template:
    metadata:
      labels:
        app: matrix-well-known
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: config
              mountPath: /data/server
              subPath: server
            - name: config
              mountPath: /data/client
              subPath: client
            - name: config
              mountPath: /data/element
              subPath: element
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "50m"
      volumes:
        - name: config
          configMap:
            name: matrix-well-known
---
apiVersion: v1
kind: Service
metadata:
  name: matrix-well-known
  namespace: comms
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: matrix-well-known
