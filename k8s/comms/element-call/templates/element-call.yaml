---
apiVersion: v1
kind: ConfigMap
metadata:
  name: element-call-config
  namespace: comms
data:
  config.json: |
    {
      "default_server_config": {
        "m.homeserver": {
          "base_url": "https://matrix.{{ .Values.global.hobbyDomain }}",
          "server_name": "{{ .Values.global.hobbyDomain }}"
        }
      },
      "enable_video": false
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: element-call
  namespace: comms
  labels:
    app: element-call
spec:
  replicas: 1
  selector:
    matchLabels:
      app: element-call
  template:
    metadata:
      labels:
        app: element-call
    spec:
      containers:
        - name: element-call
          image: ghcr.io/element-hq/element-call:v0.16.3
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /app/config.json
              subPath: config.json
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      volumes:
        - name: config
          configMap:
            name: element-call-config
---
apiVersion: v1
kind: Service
metadata:
  name: element-call
  namespace: comms
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: element-call
