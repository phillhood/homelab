---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: element-call
  namespace: comms
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`call.{{ .Values.global.hobbyDomain }}`)
      kind: Rule
      services:
        - name: element-call
          port: 8080
  tls:
    secretName: hobby-wildcard-tls
