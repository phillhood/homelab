---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prosody
  namespace: comms
  labels:
    app: prosody
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prosody
  template:
    metadata:
      labels:
        app: prosody
    spec:
      containers:
        - name: prosody
          image: jitsi/prosody:stable
          ports:
            - containerPort: 5222
              name: xmpp-c2s
            - containerPort: 5269
              name: xmpp-s2s
            - containerPort: 5280
              name: xmpp-bosh
            - containerPort: 5347
              name: xmpp-component
          env:
            - name: PUBLIC_URL
              value: "https://jitsi.{{ .Values.global.hobbyDomain }}"
            - name: XMPP_DOMAIN
              value: meet.jitsi
            - name: XMPP_AUTH_DOMAIN
              value: auth.meet.jitsi
            - name: XMPP_GUEST_DOMAIN
              value: guest.meet.jitsi
            - name: XMPP_MUC_DOMAIN
              value: muc.meet.jitsi
            - name: XMPP_INTERNAL_MUC_DOMAIN
              value: internal-muc.meet.jitsi
            - name: XMPP_MODULES
              value: ""
            - name: XMPP_MUC_MODULES
              value: ""
            - name: XMPP_INTERNAL_MUC_MODULES
              value: ""
            - name: JICOFO_AUTH_USER
              value: focus
            - name: JICOFO_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jitsi-secrets
                  key: jicofo-auth-password
            - name: JVB_AUTH_USER
              value: jvb
            - name: JVB_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jitsi-secrets
                  key: jvb-auth-password
            - name: JIBRI_XMPP_USER
              value: jibri
            - name: JIBRI_XMPP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jitsi-secrets
                  key: jibri-xmpp-password
            - name: JIBRI_RECORDER_USER
              value: recorder
            - name: JIBRI_RECORDER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jitsi-secrets
                  key: jibri-recorder-password
            - name: TZ
              value: America/Toronto
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 5222
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: prosody
  namespace: comms
spec:
  type: ClusterIP
  ports:
    - port: 5222
      targetPort: 5222
      name: xmpp-c2s
    - port: 5269
      targetPort: 5269
      name: xmpp-s2s
    - port: 5280
      targetPort: 5280
      name: xmpp-bosh
    - port: 5347
      targetPort: 5347
      name: xmpp-component
  selector:
    app: prosody
