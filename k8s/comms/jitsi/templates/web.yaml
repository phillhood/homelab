---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jitsi-web
  namespace: communication
  labels:
    app: jitsi-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jitsi-web
  template:
    metadata:
      labels:
        app: jitsi-web
    spec:
      containers:
        - name: web
          image: jitsi/web:stable
          ports:
            - containerPort: 80
              name: http
          env:
            - name: PUBLIC_URL
              value: "https://jitsi.{{ .Values.global.hobbyDomain }}"
            - name: XMPP_SERVER
              value: prosody.communication.svc.cluster.local
            - name: XMPP_DOMAIN
              value: meet.jitsi
            - name: XMPP_AUTH_DOMAIN
              value: auth.meet.jitsi
            - name: XMPP_GUEST_DOMAIN
              value: guest.meet.jitsi
            - name: XMPP_MUC_DOMAIN
              value: muc.meet.jitsi
            - name: XMPP_BOSH_URL_BASE
              value: http://prosody.communication.svc.cluster.local:5280
            - name: JICOFO_AUTH_USER
              value: focus
            - name: TZ
              value: America/Toronto
            - name: ENABLE_PREJOIN_PAGE
              value: "true"
            - name: ENABLE_WELCOME_PAGE
              value: "true"
            - name: DISABLE_HTTPS
              value: "true"
            - name: ENABLE_CLOSE_PAGE
              value: "true"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: jitsi-web
  namespace: communication
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: jitsi-web
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jitsi
  namespace: communication
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`jitsi.{{ .Values.global.hobbyDomain }}`)
      kind: Rule
      services:
        - name: jitsi-web
          port: 80
  tls:
    secretName: hobby-wildcard-tls
