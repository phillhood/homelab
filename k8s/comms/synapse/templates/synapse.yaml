---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse
  namespace: comms
  labels:
    app: synapse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synapse
  template:
    metadata:
      labels:
        app: synapse
    spec:
      initContainers:
        - name: render-config
          image: matrixdotorg/synapse:v1.145.0
          command:
            - sh
            - -c
            - |
              DB_PW=$(cat /db-secret/db-password)
              MAS_SECRET=$(cat /db-secret/mas-secret)
              sed "s|__DB_PASSWORD__|$DB_PW|g; s|__MAS_SECRET__|$MAS_SECRET|g" /config-template/homeserver.yaml > /rendered-config/homeserver.yaml
              cp /config-template/log.config /rendered-config/log.config
              if [ ! -f /data/signing.key ]; then
                python -m synapse.app.homeserver \
                  --config-path /rendered-config/homeserver.yaml \
                  --generate-keys
              fi
              chown -R 991:991 /data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config-template
              mountPath: /config-template
            - name: rendered-config
              mountPath: /rendered-config
            - name: db-secret
              mountPath: /db-secret
              readOnly: true
      containers:
        - name: synapse
          image: matrixdotorg/synapse:v1.145.0
          ports:
            - containerPort: 8008
              name: http
          env:
            - name: SYNAPSE_CONFIG_DIR
              value: /config
            - name: SYNAPSE_CONFIG_PATH
              value: /config/homeserver.yaml
          volumeMounts:
            - name: rendered-config
              mountPath: /config
            - name: data
              mountPath: /data
            - name: media
              mountPath: /media
            - name: secrets
              mountPath: /secrets
              readOnly: true
            - name: bridges
              mountPath: /bridges
              readOnly: true
            - name: config-template
              mountPath: /custom-templates/sso_redirect_confirm.html
              subPath: sso_redirect_confirm.html
            - name: config-template
              mountPath: /custom-templates/sso_auth_confirm.html
              subPath: sso_auth_confirm.html
            - name: config-template
              mountPath: /custom-templates/sso_auth_success.html
              subPath: sso_auth_success.html
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8008
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8008
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: config-template
          configMap:
            name: synapse-config
        - name: rendered-config
          emptyDir: {}
        - name: db-secret
          secret:
            secretName: synapse-secrets
        - name: data
          persistentVolumeClaim:
            claimName: synapse-data
        - name: media
          persistentVolumeClaim:
            claimName: synapse-media
        - name: secrets
          secret:
            secretName: synapse-secrets
        - name: bridges
          secret:
            secretName: discord-bridge-secrets
            optional: true
            items:
              - key: registration.yaml
                path: discord-registration.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: synapse
  namespace: comms
spec:
  type: ClusterIP
  ports:
    - port: 8008
      targetPort: 8008
      name: http
  selector:
    app: synapse
