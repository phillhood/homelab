---
apiVersion: v1
kind: ConfigMap
metadata:
  name: discord-bridge-config
  namespace: comms
data:
  config.yaml: |
    homeserver:
      address: http://synapse.comms.svc.cluster.local:8008
      domain: {{ .Values.global.hobbyDomain }}

    appservice:
      address: http://discord-bridge.comms.svc.cluster.local:29334
      hostname: 0.0.0.0
      port: 29334
      database:
        type: sqlite3-fk-wal
        uri: file:/data/discord-bridge.db?_txlock=immediate
      id: discord
      as_token: REPLACE_AS_TOKEN
      hs_token: REPLACE_HS_TOKEN
      bot:
        username: discordbot
        displayname: Discord Bridge Bot
        avatar: mxc://maunium.net/nIdEykemnwdisvHbpxflpDlC

    bridge:
      username_template: discord_{{ `{{.}}` }}
      displayname_template: "{{ `{{.Username}}` }}"
      channel_name_template: "{{ `{{if .GuildName}}{{.GuildName}}{{end}} - {{.Name}}` }}"
      portal_message_buffer: 128
      delivery_receipts: true
      message_status_events: false
      message_error_notices: true
      sync_direct_chat_list: true
      resend_bridge_info: false
      delete_portal_on_channel_delete: false
      animated_sticker: webp
      double_puppet_server_map: {}
      double_puppet_allow_discovery: true
      login_shared_secret_map:
        {{ .Values.global.hobbyDomain }}: appservice
      command_prefix: "!discord"
      management_room_text:
        welcome: "Hello, I'm a Discord bridge bot."
        welcome_connected: "Use `help` for help."
        welcome_unconnected: "Use `help` for help or `login` to log in."
      encryption:
        allow: false
        default: false
        require: false
        appservice: false
      permissions:
        "*": relay
        "{{ .Values.global.hobbyDomain }}": user
        "@admin:{{ .Values.global.hobbyDomain }}": admin

    logging:
      min_level: info
      writers:
        - type: stdout
          format: pretty-colored
