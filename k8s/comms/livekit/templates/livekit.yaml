---
apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  namespace: comms
data:
  config.yaml: |
    port: 7880
    rtc:
      tcp_port: 7881
      udp_port: 7882
      use_external_ip: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-sfu
  namespace: comms
  labels:
    app: livekit-sfu
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: livekit-sfu
  template:
    metadata:
      labels:
        app: livekit-sfu
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: kvatch
      terminationGracePeriodSeconds: 3600
      containers:
        - name: livekit
          image: livekit/livekit-server:latest
          args:
            - --config=/etc/livekit/config.yaml
          env:
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: livekit-credentials
                  key: livekit-api-key
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: livekit-credentials
                  key: livekit-api-secret
            - name: LIVEKIT_KEYS
              value: "$(LIVEKIT_API_KEY): $(LIVEKIT_API_SECRET)"
          ports:
            - containerPort: 7880
              protocol: TCP
            - containerPort: 7881
              protocol: TCP
            - containerPort: 7882
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /etc/livekit/config.yaml
              subPath: config.yaml
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
      volumes:
        - name: config
          configMap:
            name: livekit-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lk-jwt-service
  namespace: comms
  labels:
    app: lk-jwt-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lk-jwt-service
  template:
    metadata:
      labels:
        app: lk-jwt-service
    spec:
      containers:
        - name: lk-jwt-service
          image: ghcr.io/element-hq/lk-jwt-service:0.3.0
          ports:
            - containerPort: 8080
          env:
            - name: LIVEKIT_URL
              value: "ws://192.168.1.101:7880"
            - name: LIVEKIT_KEY
              valueFrom:
                secretKeyRef:
                  name: livekit-credentials
                  key: livekit-api-key
            - name: LIVEKIT_SECRET
              valueFrom:
                secretKeyRef:
                  name: livekit-credentials
                  key: livekit-api-secret
            - name: LIVEKIT_FULL_ACCESS_HOMESERVERS
              value: "shychedelic.com"
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: lk-jwt-service
  namespace: comms
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: lk-jwt-service
---
apiVersion: v1
kind: Service
metadata:
  name: livekit-sfu-ws
  namespace: comms
spec:
  ports:
    - port: 7880
      targetPort: 7880
  selector:
    app: livekit-sfu
