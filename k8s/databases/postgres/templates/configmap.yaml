---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: databases
data:
  init-databases.sh: |
    #!/bin/bash
    set -e

    create_db() {
      local user=$1
      local password_file="/etc/db-passwords/$1"
      local extra_flags="${2:-}"

      if [ ! -f "$password_file" ]; then
        echo "ERROR: password file not found for $user"
        return 1
      fi

      local password
      password=$(cat "$password_file")

      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        SELECT 'CREATE USER $user' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '$user')
        \gexec
        ALTER USER $user WITH PASSWORD '$password' $extra_flags;
      EOSQL

      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        SELECT 'CREATE DATABASE $user OWNER $user' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$user')
        \gexec
        GRANT ALL PRIVILEGES ON DATABASE $user TO $user;
      EOSQL
    }

    create_db_custom() {
      local user=$1
      local dbname=$2
      local password_file="/etc/db-passwords/$1"
      local create_opts="${3:-}"
      local extra_flags="${4:-}"

      if [ ! -f "$password_file" ]; then
        echo "ERROR: password file not found for $user"
        return 1
      fi

      local password
      password=$(cat "$password_file")

      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        SELECT 'CREATE USER $user' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '$user')
        \gexec
        ALTER USER $user WITH PASSWORD '$password' $extra_flags;
      EOSQL

      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        SELECT 'CREATE DATABASE $dbname OWNER $user $create_opts' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$dbname')
        \gexec
        GRANT ALL PRIVILEGES ON DATABASE $dbname TO $user;
      EOSQL
    }

    echo "Initializing databases..."

    create_db comet
    create_db zilean
    create_db headscale
    create_db mealie
    create_db_custom synapse synapse "ENCODING 'UTF8' LC_COLLATE='C' LC_CTYPE='C' TEMPLATE template0"
    create_db shychedelic "CONNECTION LIMIT 20"
    create_db mas
    create_db scryer

    echo "Database initialization complete."
