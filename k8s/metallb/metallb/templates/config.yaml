---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default-pool
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  addresses:
    {{- range .Values.ipAddressPool.addresses }}
    - {{ . }}
    {{- end }}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  ipAddressPools:
    - default-pool
