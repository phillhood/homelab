---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: web
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: homepage
  namespace: web
  annotations:
    kubernetes.io/service-account.name: homepage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, nodes]
    verbs: [get, list]
  - apiGroups: [extensions, networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list]
  - apiGroups: [traefik.io]
    resources: [ingressroutes]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: web
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: web
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: Homelab
    headerStyle: boxed
    useEqualHeights: true
    statusStyle: dot
    color: zinc
    theme: dark
    background:
      image: /images/purple_nebula.jpg
      opacity: 50
    layout:
      Apps:
        style: row
        columns: 2
        useEqualHeights: true
      Media:
        style: column
        rows: 4
      Gaming:
        style: column
        rows: 4
      Infrastructure:
        style: row
        columns: 3
        useEqualHeights: true
      Networking:
        style: column
        rows: 2
      Monitoring:
        style: column
        rows: 3
      Utils:
        style: column
        rows: 3

  custom.css: |
    .service {
      height: 100%;
    }
    .services-group {
      align-items: stretch;
    }
    .service-card {
      height: 100%;
      backdrop-filter: blur(12px);
    }
    .services-group .service-group-name {
      font-size: 0.85rem !important;
      font-style: italic;
    }
    .subgroup .service-group-name {
      font-style: normal;
    }
  custom.js: ""
  bookmarks.yaml: ""
  services.yaml: |
    - Apps:
        - Media:
            - Comet:
                href: https://comet.{{ .Values.global.homeDomain }}/admin
                siteMonitor: http://comet.media.svc.cluster.local
                icon: mdi-meteor-#ff6b35
                namespace: media
                podSelector: app=comet
            - Prowlarr:
                href: https://prowlarr.{{ .Values.global.homeDomain }}
                siteMonitor: http://prowlarr.media.svc.cluster.local/ping
                icon: prowlarr
                namespace: media
                podSelector: app=prowlarr
                widget:
                  type: prowlarr
                  url: http://prowlarr.media.svc.cluster.local
                  key: {{`{{HOMEPAGE_VAR_PROWLARR_API_KEY}}`}}

        - Home:
            - Home Assistant:
                href: https://ha.{{ .Values.global.homeDomain }}
                siteMonitor: http://home-assistant.home.svc.cluster.local
                icon: home-assistant
                namespace: home
                podSelector: app=home-assistant
                widget:
                  type: homeassistant
                  url: http://home-assistant.home.svc.cluster.local
                  key: {{`{{HOMEPAGE_VAR_HOMEASSISTANT_API_KEY}}`}}
            - Mealie:
                href: https://mealie.{{ .Values.global.homeDomain }}
                siteMonitor: http://mealie.home.svc.cluster.local
                icon: mealie
                namespace: home
                podSelector: app=mealie
                widget:
                  type: customapi
                  url: http://mealie.home.svc.cluster.local/api/households/statistics
                  headers:
                    Authorization: Bearer {{`{{HOMEPAGE_VAR_MEALIE_API_KEY}}`}}
                  mappings:
                    - field: totalRecipes
                      label: Recipes
                      format: number
                    - field: totalCategories
                      label: Categories
                      format: number
                    - field: totalTags
                      label: Tags
                      format: number

        - Gaming:
            - Pelican:
                href: https://pelican.{{ .Values.global.homeDomain }}
                siteMonitor: https://pelican.{{ .Values.global.homeDomain }}
                icon: si-pelican-#38bdf8
                widget:
                  type: customapi
                  url: https://pelican.{{ .Values.global.homeDomain }}/api/application/servers
                  headers:
                    Authorization: Bearer {{`{{HOMEPAGE_VAR_PELICAN_API_KEY}}`}}
                    Accept: application/json
                  mappings:
                    - field: meta.pagination.total
                      label: Servers
                      format: number

    - Infrastructure:
        - Networking:
            - Pi-hole:
                href: https://pihole.{{ .Values.global.homeDomain }}/admin/
                siteMonitor: https://pihole.{{ .Values.global.homeDomain }}/admin/
                icon: pi-hole
                widget:
                  type: pihole
                  url: https://pihole.{{ .Values.global.homeDomain }}
                  key: {{`{{HOMEPAGE_VAR_PIHOLE_API_KEY}}`}}
            - OPNsense:
                href: https://opnsense.{{ .Values.global.homeDomain }}
                siteMonitor: https://opnsense.{{ .Values.global.homeDomain }}
                icon: opnsense
                widget:
                  type: opnsense
                  url: https://opnsense.{{ .Values.global.homeDomain }}
                  username: {{`{{HOMEPAGE_VAR_OPNSENSE_KEY}}`}}
                  password: {{`{{HOMEPAGE_VAR_OPNSENSE_SECRET}}`}}
            - Traefik:
                href: https://traefik.{{ .Values.global.homeDomain }}/dashboard/
                siteMonitor: http://traefik-api.kube-system.svc.cluster.local:8080/ping
                icon: traefik
                namespace: kube-system
                podSelector: app.kubernetes.io/name=traefik
                widget:
                  type: traefik
                  url: http://traefik-api.kube-system.svc.cluster.local:8080
            - Headscale:
                href: https://vpn.{{ .Values.global.homeDomain }}/admin
                siteMonitor: http://headscale.headscale.svc.cluster.local:8080/health
                icon: headscale
                namespace: headscale
                podSelector: app=headscale
                widget:
                  type: headscale
                  url: http://headscale.headscale.svc.cluster.local:8080
                  key: {{`{{HOMEPAGE_VAR_HEADSCALE_KEY}}`}}
                  nodeId: 10

        - Monitoring:
            - Gatus:
                href: https://status.{{ .Values.global.homeDomain }}
                siteMonitor: http://gatus.monitoring.svc.cluster.local:8080
                icon: gatus
                namespace: monitoring
                podSelector: app=gatus
                widget:
                  type: gatus
                  url: http://gatus.monitoring.svc.cluster.local:8080
            - Grafana:
                href: https://grafana.{{ .Values.global.homeDomain }}
                siteMonitor: http://grafana.monitoring.svc.cluster.local
                icon: grafana
                namespace: monitoring
                podSelector: app.kubernetes.io/name=grafana
                widget:
                  type: grafana
                  url: http://grafana.monitoring.svc.cluster.local
                  username: {{`{{HOMEPAGE_VAR_GRAFANA_USER}}`}}
                  password: {{`{{HOMEPAGE_VAR_GRAFANA_PASS}}`}}
            - Prometheus:
                href: https://prometheus.{{ .Values.global.homeDomain }}
                siteMonitor: http://prometheus.monitoring.svc.cluster.local
                icon: prometheus
                namespace: monitoring
                podSelector: app.kubernetes.io/name=prometheus
                widget:
                  type: prometheus
                  url: http://prometheus.monitoring.svc.cluster.local

        - Utils:
            - pgAdmin:
                href: https://pgadmin.{{ .Values.global.homeDomain }}
                siteMonitor: http://pgadmin.tools.svc.cluster.local/misc/ping
                icon: pgadmin
                namespace: tools
                podSelector: app=pgadmin
            - Sealed Secrets Web:
                href: https://secrets.{{ .Values.global.homeDomain }}
                siteMonitor: https://secrets.{{ .Values.global.homeDomain }}
                icon: mdi-lock-#ffd700
                namespace: sealed-secrets
                podSelector: app.kubernetes.io/name=sealed-secrets-web
            - Zot Registry:
                href: https://registry.{{ .Values.global.homeDomain }}
                siteMonitor: http://zot.kube-system.svc.cluster.local:5000
                icon: docker
                namespace: kube-system
                podSelector: app=zot

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - datetime:
        text_size: sm
        format:
          timeStyle: short
          dateStyle: short
    - openmeteo:
        units: metric
        cache: 5
        href: https://www.google.com/search?q=weather

  docker.yaml: ""
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: web
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app: homepage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      nodeSelector:
        kubernetes.io/hostname: cyrodiil
      serviceAccountName: homepage
      automountServiceAccountToken: true
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          ports:
            - containerPort: 3000
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: home.{{ .Values.global.homeDomain }}
            - name: HOMEPAGE_VAR_PIHOLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: pihole-api-key
            - name: HOMEPAGE_VAR_GRAFANA_USER
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: grafana-user
            - name: HOMEPAGE_VAR_GRAFANA_PASS
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: grafana-pass
            - name: HOMEPAGE_VAR_PELICAN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: pelican-api-key
                  optional: true
            - name: HOMEPAGE_VAR_PROWLARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: prowlarr-api-key
                  optional: true
            - name: HOMEPAGE_VAR_OPNSENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: opnsense-key
            - name: HOMEPAGE_VAR_OPNSENSE_SECRET
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: opnsense-secret
            - name: HOMEPAGE_VAR_HEADSCALE_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: headscale-key
                  optional: true
            - name: HOMEPAGE_VAR_MEALIE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: mealie-api-key
                  optional: true
            - name: HOMEPAGE_VAR_HOMEASSISTANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: homeassistant-api-key
                  optional: true
          volumeMounts:
            - mountPath: /app/config/custom.js
              name: config
              subPath: custom.js
            - mountPath: /app/config/custom.css
              name: config
              subPath: custom.css
            - mountPath: /app/config/bookmarks.yaml
              name: config
              subPath: bookmarks.yaml
            - mountPath: /app/config/docker.yaml
              name: config
              subPath: docker.yaml
            - mountPath: /app/config/kubernetes.yaml
              name: config
              subPath: kubernetes.yaml
            - mountPath: /app/config/services.yaml
              name: config
              subPath: services.yaml
            - mountPath: /app/config/settings.yaml
              name: config
              subPath: settings.yaml
            - mountPath: /app/config/widgets.yaml
              name: config
              subPath: widgets.yaml
            - mountPath: /app/config/logs
              name: logs
            - mountPath: /app/public/images
              name: images
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: config
          configMap:
            name: homepage
        - name: logs
          emptyDir: {}
        - name: images
          hostPath:
            path: /home/shy/homelab/assets/backgrounds
            type: Directory
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    gethomepage.dev/enabled: "false"
spec:
  rules:
    - host: home.{{ .Values.global.homeDomain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 3000
  tls:
    - hosts:
        - home.{{ .Values.global.homeDomain }}
