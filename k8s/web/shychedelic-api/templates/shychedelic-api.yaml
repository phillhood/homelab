---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shychedelic-api
  namespace: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shychedelic-api
  template:
    metadata:
      labels:
        app: shychedelic-api
    spec:
      containers:
        - name: shychedelic-api
          image: {{ .Values.global.registry }}/shychedelic-api:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_HOST
              value: "postgres.databases.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              value: "shychedelic"
            - name: DB_DATABASE
              value: "shychedelic"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shychedelic-api-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shychedelic-api-secrets
                  key: jwt-secret
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: shychedelic-api-secrets
                  key: jwt-refresh-secret
            - name: TOTP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: shychedelic-api-secrets
                  key: totp-encryption-key
            - name: SYNAPSE_URL
              value: "http://synapse.comms.svc.cluster.local:8008"
            - name: MATRIX_SERVER_NAME
              value: "shychedelic.com"
            - name: SYNAPSE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: shychedelic-api-secrets
                  key: synapse-admin-token
            - name: ELEMENT_URL
              value: "https://element.{{ .Values.global.hobbyDomain }}"
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: shychedelic-api-secrets
                  key: resend-api-key
            - name: APP_URL
              value: "https://{{ .Values.global.hobbyDomain }}"
            - name: MAIL_FROM
              value: "noreply@{{ .Values.global.hobbyDomain }}"
            - name: OIDC_ISSUER
              value: "https://{{ .Values.global.hobbyDomain }}"
            - name: OIDC_API_BASE_URL
              value: "https://api.{{ .Values.global.hobbyDomain }}"
            - name: OIDC_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: shychedelic-api-secrets
                  key: oidc-signing-key
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: shychedelic-api
  namespace: web
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: shychedelic-api
