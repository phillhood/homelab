apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: homelab
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/phillhood/homelab.git
        revision: HEAD
        directories:
          - path: k8s/*/*
          - path: k8s/argocd
            exclude: true
  template:
    metadata:
      name: "{{ .path.basename }}"
      annotations:
        argocd.argoproj.io/sync-wave: |-
          {{- $parent := index (splitList "/" .path.path) 1 -}}
          {{- $app := .path.basename -}}
          {{- if eq $app "sealed-secrets" -}}
          -1
          {{- else if or (eq $app "metallb") (eq $app "cert-manager") -}}
          0
          {{- else if eq $parent "infrastructure" -}}
          1
          {{- else if or (eq $parent "cloudflare") (eq $parent "networking") (eq $parent "vpn") -}}
          2
          {{- else if eq $parent "databases" -}}
          3
          {{- else if eq $parent "monitoring" -}}
          4
          {{- else -}}
          5
          {{- end -}}
    spec:
      project: homelab
      source:
        repoURL: https://github.com/phillhood/homelab.git
        targetRevision: HEAD
        path: "{{ .path.path }}"
        helm:
          ignoreMissingValueFiles: true
          valueFiles:
            - ../../values.yaml
            - values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: |-
          {{- $parent := index (splitList "/" .path.path) 1 -}}
          {{- if eq $parent "infrastructure" -}}
          kube-system
          {{- else if eq $parent "metallb" -}}
          metallb-system
          {{- else if eq $parent "sealed-secrets" -}}
          sealed-secrets
          {{- else if eq $parent "cert-manager" -}}
          cert-manager
          {{- else -}}
          {{ $parent }}
          {{- end -}}
      syncPolicy:
        retry:
          limit: 3
          backoff:
            duration: 10s
            factor: 2
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
