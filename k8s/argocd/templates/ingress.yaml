apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`argocd.{{ .Values.global.homeDomain }}`)
      kind: Rule
      services:
        - name: argocd-argo-cd-server
          port: 80
  tls:
    secretName: home-root-wildcard-tls
