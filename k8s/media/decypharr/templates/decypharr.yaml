---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: decypharr
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: decypharr
  template:
    metadata:
      labels:
        app: decypharr
    spec:
      nodeSelector:
        kubernetes.io/hostname: lab
      containers:
        - name: decypharr
          image: ghcr.io/sirrobot01/decypharr:latest
          ports:
            - containerPort: 8282
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Toronto
            - name: TORBOX__API_KEY
              valueFrom:
                secretKeyRef:
                  name: comet-secrets
                  key: torbox-api-key
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_ADMIN
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
              mountPropagation: Bidirectional
            - name: dev-fuse
              mountPath: /dev/fuse
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: decypharr-config
        - name: downloads
          hostPath:
            path: /srv/downloads
            type: DirectoryOrCreate
        - name: dev-fuse
          hostPath:
            path: /dev/fuse
            type: CharDevice
---
apiVersion: v1
kind: Service
metadata:
  name: decypharr
  namespace: media
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8282
  selector:
    app: decypharr
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: decypharr
  namespace: media
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - decypharr.pharah.ca
  rules:
    - host: decypharr.pharah.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: decypharr
                port:
                  number: 80
