---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comet
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: comet
  template:
    metadata:
      labels:
        app: comet
    spec:
      containers:
        - name: comet
          image: ghcr.io/g0ldyy/comet:latest
          ports:
            - containerPort: 8000
          env:
            - name: ADDON_NAME
              value: "Comet"
            - name: DATABASE_TYPE
              value: postgresql
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: comet-secrets
                  key: db-password
            - name: DATABASE_URL
              value: "comet:$(DB_PASSWORD)@postgres.databases.svc.cluster.local:5432/comet"
            - name: FASTAPI_WORKERS
              value: "2"
            - name: BACKGROUND_SCRAPER_ENABLED
              value: "True"
            - name: BACKGROUND_SCRAPER_INTERVAL
              value: "3600"
            - name: BACKGROUND_SCRAPER_CONCURRENT_WORKERS
              value: "1"
            - name: BACKGROUND_SCRAPER_MAX_MOVIES_PER_RUN
              value: "100"
            - name: BACKGROUND_SCRAPER_MAX_SERIES_PER_RUN
              value: "100"
            - name: SCRAPE_TORRENTIO
              value: "live"
            - name: SCRAPE_ZILEAN
              value: "both"
            - name: ZILEAN_URL
              value: "http://zilean.media.svc.cluster.local"
            - name: SCRAPE_TORBOX
              value: "False"
            # - name: TORBOX_API_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: comet-secrets
            #       key: torbox-api-key
            # - name: PROXY_DEBRID_STREAM
            #   value: "False"
            # - name: PROXY_DEBRID_STREAM_DEBRID_DEFAULT_SERVICE
            #   value: "torbox"
            # - name: PROXY_DEBRID_STREAM_DEBRID_DEFAULT_APIKEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: comet-secrets
            #       key: torbox-api-key
            # - name: PROXY_DEBRID_STREAM_PASSWORD
            #   valueFrom:
            #     secretKeyRef:
            #       name: comet-secrets
            #       key: proxy-password
            - name: ADMIN_DASHBOARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: comet-secrets
                  key: admin-password
            - name: HTTP_CACHE_ENABLED
              value: "False"
            - name: LIVE_TORRENT_CACHE_TTL
              value: "3600"
            - name: DEBRID_CACHE_TTL
              value: "3600"
            - name: EXECUTOR_MAX_WORKERS
              value: "2"
            - name: SCRAPE_WAIT_TIMEOUT
              value: "10"
          resources:
            requests:
              memory: "1Gi"
              cpu: "100m"
            limits:
              memory: "4Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: comet
  namespace: media
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
  selector:
    app: comet
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: comet-cert
  namespace: media
spec:
  secretName: comet-cert-tls
  dnsNames:
    - comet.{{ .Values.global.homeDomain }}
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: comet
  namespace: media
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - comet.{{ .Values.global.homeDomain }}
  rules:
    - host: comet.{{ .Values.global.homeDomain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: comet
                port:
                  number: 80
