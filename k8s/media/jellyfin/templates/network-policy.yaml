apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-traefik
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8096
        - protocol: TCP
          port: 7878
        - protocol: TCP
          port: 8989
        - protocol: TCP
          port: 9696
        - protocol: TCP
          port: 5055
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8282
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jellyseerr-to-arr-stack
spec:
  podSelector:
    matchLabels:
      app: radarr
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: jellyseerr
      ports:
        - protocol: TCP
          port: 7878
---
apiVersion: networking.k8s.io/v1
