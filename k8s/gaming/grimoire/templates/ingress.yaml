apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grimoire
  namespace: gaming
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grimoire.{{ .Values.global.hobbyDomain }}`)
      kind: Rule
      middlewares:
        - name: cloudflare-only
          namespace: kube-system
        - name: rate-limit
          namespace: kube-system
        - name: secure-headers
          namespace: kube-system
      services:
        - name: grimoire
          port: 8080
  tls:
    secretName: hobby-wildcard-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grimoire-local
  namespace: gaming
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - grimoire.{{ .Values.global.homeDomain }}
  rules:
    - host: grimoire.{{ .Values.global.homeDomain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grimoire
                port:
                  number: 8080
