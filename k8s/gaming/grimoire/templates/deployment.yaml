apiVersion: apps/v1
kind: Deployment
metadata:
  name: grimoire
  namespace: gaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grimoire
  template:
    metadata:
      labels:
        app: grimoire
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: grimoire
          image: {{ .Values.global.registry }}/grimoire:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: grimoire-secrets
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: data
              mountPath: /data
            - name: gamedata
              mountPath: /srv/gameservers
            - name: backups
              mountPath: /srv/backups
            - name: config
              mountPath: /etc/grimoire/config.yaml
              subPath: config.yaml
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
        # --- Docker Socket Proxy (disabled) ---
        # Uncomment to restrict Docker API access. Grimoire should connect to
        # tcp://localhost:2375 instead of mounting the socket directly.
        # When enabling, remove the docker-sock volumeMount from grimoire container
        # and set docker.socketPath in config to tcp://localhost:2375.
        #
        # - name: docker-socket-proxy
        #   image: tecnativa/docker-socket-proxy:latest
        #   ports:
        #     - containerPort: 2375
        #   env:
        #     - name: CONTAINERS
        #       value: "1"
        #     - name: IMAGES
        #       value: "1"
        #     - name: NETWORKS
        #       value: "1"
        #     - name: POST
        #       value: "1"
        #     - name: EXEC
        #       value: "0"
        #     - name: BUILD
        #       value: "0"
        #     - name: COMMIT
        #       value: "0"
        #     - name: SWARM
        #       value: "0"
        #   volumeMounts:
        #     - name: docker-sock
        #       mountPath: /var/run/docker.sock
        #   resources:
        #     requests:
        #       memory: "32Mi"
        #       cpu: "25m"
        #     limits:
        #       memory: "64Mi"
        #       cpu: "100m"
      volumes:
        - name: docker-sock
          hostPath:
            path: {{ .Values.docker.socketPath }}
            type: Socket
        - name: data
          hostPath:
            path: {{ .Values.storage.dataPath }}
            type: DirectoryOrCreate
        - name: gamedata
          hostPath:
            path: {{ .Values.storage.gameDataPath }}
            type: DirectoryOrCreate
        - name: backups
          hostPath:
            path: {{ .Values.storage.backupPath }}
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: grimoire-config
