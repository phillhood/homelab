api:
  image: scryer-api
  tag: latest
  replicas: 1
  port: 8000
  resources:
    requests:
      memory: 128Mi
      cpu: 250m
    limits:
      memory: 256Mi
      cpu: 500m

frontend:
  image: scryer-frontend
  tag: latest
  replicas: 1
  port: 80
  resources:
    requests:
      memory: 32Mi
      cpu: 50m
    limits:
      memory: 64Mi
      cpu: 200m

worker:
  image: scryer-worker
  tag: latest
  replicas: 1
  resources:
    requests:
      memory: 256Mi
      cpu: 500m
    limits:
  simcThreads: 8
  defaultIterations: 10000

database:
  host: postgres.databases.svc.cluster.local
  port: 5432
  name: scryer
  username: scryer

redis:
  host: redis.databases.svc.cluster.local
  port: 6379

reports:
  storage: 5Gi
  ttlHours: 24
