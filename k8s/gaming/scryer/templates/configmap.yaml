apiVersion: v1
kind: ConfigMap
metadata:
  name: scryer-config
data:
  REDIS_URL: "redis://{{ .Values.redis.host }}:{{ .Values.redis.port }}"
  DATABASE_URL: "postgresql://{{ .Values.database.username }}:$(DB_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode=disable"
  SIMC_THREADS: {{ .Values.worker.simcThreads | quote }}
  DEFAULT_ITERATIONS: {{ .Values.worker.defaultIterations | quote }}
  REPORT_PATH: "/reports"
  REPORT_TTL_HOURS: {{ .Values.reports.ttlHours | quote }}
  PORT: {{ .Values.api.port | quote }}
  API_URL: "http://scryer-api:{{ .Values.api.port }}"
