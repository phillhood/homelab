apiVersion: apps/v1
kind: Deployment
metadata:
  name: scryer-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: scryer-frontend
  template:
    metadata:
      labels:
        app: scryer-frontend
    spec:
      nodeSelector:
        kubernetes.io/hostname: kvatch
      containers:
        - name: frontend
          image: {{ .Values.global.registry }}/{{ .Values.frontend.image }}:{{ .Values.frontend.tag }}
          ports:
            - containerPort: {{ .Values.frontend.port }}
          env:
            - name: API_URL
              value: "http://scryer-api:{{ .Values.api.port }}"
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: scryer-frontend
spec:
  selector:
    app: scryer-frontend
  ports:
    - port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}
