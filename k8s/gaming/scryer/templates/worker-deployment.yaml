apiVersion: apps/v1
kind: Deployment
metadata:
  name: scryer-worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: scryer-worker
  template:
    metadata:
      labels:
        app: scryer-worker
    spec:
      nodeSelector:
        kubernetes.io/hostname: kvatch
      containers:
        - name: worker
          image: {{ .Values.global.registry }}/{{ .Values.worker.image }}:{{ .Values.worker.tag }}
          envFrom:
            - configMapRef:
                name: scryer-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scryer-secrets
                  key: db-password
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.database.username }}:$(DB_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode=disable"
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: reports
              mountPath: /reports
      volumes:
        - name: reports
          persistentVolumeClaim:
            claimName: scryer-reports
