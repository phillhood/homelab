---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus
  namespace: monitoring
data:
  config.yaml: |
    storage:
      type: sqlite
      path: /data/data.db

    ui:
      title: Homelab Uptime
      header: Homelab Uptime

    endpoints:
      - name: Comet
        group: Media
        url: https://comet.{{ .Values.global.homeDomain }}
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: Prowlarr
        group: Media
        url: https://prowlarr.{{ .Values.global.homeDomain }}
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: Zilean
        group: Media
        url: http://zilean.media.svc.cluster.local/healthchecks/ping
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: Synapse
        group: Comms
        url: http://synapse.comms.svc.cluster.local:8008/_matrix/client/versions
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: Mealie
        group: Home
        url: https://mealie.{{ .Values.global.homeDomain }}/api/app/about
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: Home Assistant
        group: Home
        url: https://ha.{{ .Values.global.homeDomain }}
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: Shychedelic Web
        group: Web
        url: http://shychedelic-web.web.svc.cluster.local
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: Shychedelic API
        group: Web
        url: http://shychedelic-api.web.svc.cluster.local:3000/health
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: Pelican
        group: Gaming
        url: http://pelican.gaming.svc.cluster.local
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: Pi-hole
        group: Networking
        url: https://pihole.{{ .Values.global.homeDomain }}/admin/
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: Traefik
        group: Networking
        url: https://traefik.{{ .Values.global.homeDomain }}/dashboard/
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: OPNsense
        group: Networking
        url: https://opnsense.{{ .Values.global.homeDomain }}
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: Headscale
        group: Networking
        url: https://vpn.{{ .Values.global.homeDomain }}/health
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: Homepage
        group: Monitoring
        url: https://home.{{ .Values.global.homeDomain }}
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 1000"

      - name: Grafana
        group: Monitoring
        url: https://grafana.{{ .Values.global.homeDomain }}/api/health
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: Prometheus
        group: Monitoring
        url: https://prometheus.{{ .Values.global.homeDomain }}/-/healthy
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: pgAdmin
        group: Utils
        url: https://pgadmin.{{ .Values.global.homeDomain }}/misc/ping
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: Sealed Secrets Web
        group: Utils
        url: https://secrets.{{ .Values.global.homeDomain }}
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: Headlamp
        group: Utils
        url: https://headlamp.{{ .Values.global.homeDomain }}
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: Zot Registry
        group: Utils
        url: https://registry.{{ .Values.global.homeDomain }}/v2/
        interval: 60s
        conditions:
          - "[STATUS] == 200"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gatus
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gatus
  namespace: monitoring
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: gatus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gatus
  template:
    metadata:
      labels:
        app: gatus
    spec:
      containers:
        - name: gatus
          image: twinproduction/gatus:latest
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: config
          configMap:
            name: gatus
        - name: data
          persistentVolumeClaim:
            claimName: gatus
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gatus
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - status.{{ .Values.global.homeDomain }}
  rules:
    - host: status.{{ .Values.global.homeDomain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gatus
                port:
                  number: 8080
