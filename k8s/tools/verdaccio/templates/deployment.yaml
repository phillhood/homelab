apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdaccio
  namespace: tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: verdaccio
  template:
    metadata:
      labels:
        app: verdaccio
    spec:
      containers:
        - name: verdaccio
          image: verdaccio/verdaccio:6
          ports:
            - containerPort: 4873
          volumeMounts:
            - name: data
              mountPath: /verdaccio/storage
            - name: config
              mountPath: /verdaccio/conf/config.yaml
              subPath: config.yaml
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /-/ping
              port: 4873
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/ping
              port: 4873
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: verdaccio
        - name: config
          configMap:
            name: verdaccio-config