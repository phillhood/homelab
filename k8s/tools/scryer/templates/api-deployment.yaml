apiVersion: apps/v1
kind: Deployment
metadata:
  name: scryer-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: scryer-api
  template:
    metadata:
      labels:
        app: scryer-api
    spec:
      containers:
        - name: api
          image: {{ .Values.global.registry }}/{{ .Values.api.image }}:{{ .Values.api.tag }}
          ports:
            - containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: scryer-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scryer-secrets
                  key: DATABASE_PASSWORD
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: scryer-api
spec:
  selector:
    app: scryer-api
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
