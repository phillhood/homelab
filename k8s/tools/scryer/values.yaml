api:
  image: scryer-api
  tag: latest
  replicas: 1
  port: 8000
  resources:
    requests:
      memory: 128Mi
      cpu: 250m
    limits:
      memory: 256Mi
      cpu: 500m

frontend:
  image: scryer-frontend
  tag: latest
  replicas: 1
  port: 80
  resources:
    requests:
      memory: 32Mi
      cpu: 50m
    limits:
      memory: 64Mi
      cpu: 200m

worker:
  image: scryer-worker
  tag: latest
  replicas: 1
  resources:
    requests:
      memory: 256Mi
      cpu: 500m
    limits:
      memory: 512Mi
      cpu: "1"
  simcThreads: 4
  defaultIterations: 10000

redis:
  enabled: true
  image: redis:7-alpine
  resources:
    requests:
      memory: 64Mi
      cpu: 100m

postgresql:
  enabled: true
  image: postgres:16-alpine
  storage: 5Gi
  database: scryer
  username: scryer

reports:
  storage: 5Gi
  ttlHours: 24
